<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Honey Barrel Hunter – Sensory</title>

    <!-- Skin2 styles -->
    <link rel="stylesheet" href="../assets/css/skin2.css" />
  </head>

  <body data-page="sensory">
    <main class="skin2-wrap">
      <!-- Skin2 Header Injection Target -->
      <div id="site-header"></div>

      <section class="skin2-card">
        <div class="skin2-controls">
          <input
            id="filter"
            type="text"
            placeholder="Search sensory notes…"
            aria-label="Search sensory notes"
          />
          <span class="skin2-status" id="status">Loading…</span>
        </div>

        <!-- Sensory Render Target -->
        <div class="skin2-table-wrap">
          <div id="sensory-content"></div>
        </div>

        <div id="error" class="skin2-error" style="display:none;"></div>
      </section>

      <!-- Skin2 Footer Injection Target -->
      <div id="site-footer"></div>
    </main>

    <!-- Scripts -->
    <script src="../assets/js/site-chrome.js"></script>
    <script type="module" src="../assets/js/sensory-page.js?v=skin2_001"></script>

    <!-- Reuse existing filter logic (expects #filter + rows with data-search) -->
    <script type="module" src="../assets/js/inventory-filter.js?v=skin2_002"></script>
  </body>
</html>

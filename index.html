<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Honey Barrel Hunter Portal</title>
    <link rel="stylesheet" href="./assets/css/skin2.css" />

    <style>
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181, 122, 42, 0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225, 182, 106, 0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 14px 46px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .brand h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.2px;
      }

      .brand .sub {
        margin-top: 6px;
        color: var(--s2-text-muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .under-construction {
        margin-top: 6px;
        font-weight: 800;
        letter-spacing: 0.6px;
        color: var(--s2-amber);
      }

      .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin: 18px 2px 10px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.3px;
        color: rgba(43, 29, 20, 0.90);
        text-transform: uppercase;
      }

      .mono { font-family: var(--s2-font-mono); }

      .muted-card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.55);
        border-radius: 16px;
        padding: 14px;
        color: var(--s2-text-muted);
      }

      .error {
        border: 1px solid rgba(231, 76, 60, 0.35);
        background: rgba(231, 76, 60, 0.10);
        color: rgba(43, 29, 20, 0.92);
      }
    </style>
  </head>

  <body data-page="home">
    <div class="wrap">
      <!-- Skin2 Header Injection Target -->
      <div id="site-header"></div>

      <!-- Top message (optional) -->
      <div class="topbar">
        <div class="brand">
          <h1>Honey Barrel Hunter</h1>
          <div class="sub under-construction">*** Under Construction ***</div>
        </div>
      </div>

      <!-- Journal -->
      <div class="section-title">
        <h2>Latest Updates</h2>
      </div>
      <div id="journalMount" class="muted-card">Loading updates…</div>

      <!-- Barrel Pickers -->
      <div class="section-title" style="margin-top:22px;">
        <h2>Barrel Pickers</h2>
      </div>
      <div id="pickerMount" class="muted-card">Loading barrel pickers…</div>

      <!-- Skin2 Footer Injection Target -->
      <div id="site-footer"></div>
    </div>

    <!-- Skin2 layout injector -->
    <script src="./assets/js/site-chrome.js"></script>

    <!-- Landing logic -->
    <script type="module" src="./assets/js/home-page.js"></script>
  </body>
</html>

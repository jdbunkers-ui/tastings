<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barrel Picker | The Speakeasy</title>

    <!-- Site CSS (same pattern as distilleries/index.html) -->
    <link rel="stylesheet" href="../assets/css/site.css" />

    <!-- Tiny page-specific helpers (optional) -->
    <style>
      /* Keep this minimal so site.css stays the source of truth */
      .bp-hero {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 18px;
        align-items: start;
        margin-top: 14px;
      }
      @media (max-width: 900px) {
        .bp-hero { grid-template-columns: 1fr; }
      }

      .bp-photo {
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
      }
      .bp-photo img {
        width: 100%;
        height: auto;
        display: block;
      }

      .bp-card {
        border-radius: 16px;
        padding: 16px;
      }

      .bp-meta {
        margin-top: 8px;
        display: grid;
        gap: 6px;
        color: rgba(0,0,0,0.7);
        font-size: 14px;
      }

      .bp-links {
        margin-top: 10px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
      }

      .bp-table-wrap { margin-top: 18px; }
      .bp-table-title {
        margin: 18px 0 10px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        font-size: 13px;
        opacity: 0.85;
      }

      table.bp-table {
        width: 100%;
        border-collapse: collapse;
      }
      table.bp-table th,
      table.bp-table td {
        padding: 10px 10px;
        border-bottom: 1px solid rgba(0,0,0,0.08);
        vertical-align: top;
        font-size: 14px;
      }
      table.bp-table th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        opacity: 0.75;
        white-space: nowrap;
      }
      .num { text-align: right; white-space: nowrap; }
      .muted { opacity: 0.75; }
    </style>
  </head>

  <body>
    <div id="site-header"></div>

    <main class="page">
      <h1 id="bp-title">Barrel Picker</h1>
      <p class="muted" id="bp-subtitle">Loading…</p>

      <div id="bp-status" class="muted"></div>

      <!-- HERO -->
      <section class="bp-hero">
        <div class="bp-photo" id="bp-photo"></div>

        <div class="bp-card" id="bp-card">
          <!-- JS renders store details here -->
        </div>
      </section>

      <!-- BARRELS TABLE -->
      <section class="bp-table-wrap">
        <div class="bp-table-title" id="bp-table-title">Barrel picks</div>
        <div id="bp-table"></div>
      </section>

      <!-- Debug (optional) -->
      <details style="margin-top:18px;">
        <summary>Debug</summary>
        <pre id="bp-debug" style="white-space:pre-wrap;"></pre>
      </details>
    </main>

    <div id="site-footer"></div>

    <!-- layout.js injects header/footer -->
    <script src="../assets/js/layout.js"></script>

    <!-- Page logic -->
    <script type="module" src="../assets/js/barrelPickerPage.js"></script>
  </body>
</html>

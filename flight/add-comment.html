<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Flight Comment – Honey Barrel Hunter</title>

  <link rel="stylesheet" href="../assets/css/skin2.css" />

  <style>
    .flight-comment-form {
      display: grid;
      gap: 14px;
      max-width: 640px;
      margin: 0 auto;
    }

    .flight-comment-form label {
      font-size: 13px;
      font-weight: 700;
    }

    .flight-comment-form input,
    .flight-comment-form textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--s2-border);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .flight-comment-form input[readonly] {
      background: rgba(246, 241, 234, 0.7);
      cursor: not-allowed;
    }

    .flight-comment-submit {
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(181, 122, 42, 0.55);
      background: rgba(246, 241, 234, 0.92);
      color: var(--s2-text);
      cursor: pointer;
      font-weight: 900;
    }

    .flight-comment-success {
      color: green;
      font-weight: 700;
      margin-top: 8px;
    }

    .flight-comment-error {
      color: #9b2c2c;
      font-weight: 700;
      margin-top: 8px;
    }
  </style>
</head>

<body data-page="flight-comment-add">
  <main class="skin2-wrap">
    <div id="site-header"></div>

    <section class="skin2-card">
      <h2>Add Flight Comment</h2>

      <form id="flightCommentForm" class="flight-comment-form">
        <div>
          <label>Flight ID</label>
          <input id="flight_id" readonly />
        </div>

        <div>
          <label>Your Name</label>
          <input id="commenter_name" required />
        </div>

        <div>
          <label>Instagram Account</label>
          <input id="ig_account" placeholder="@yourhandle" />
        </div>

        <div>
          <label>Comment</label>
          <textarea id="comment_text" rows="6" required></textarea>
        </div>

        <button class="flight-comment-submit" type="submit">
          Submit Comment
        </button>

        <div id="formMessage"></div>
      </form>
    </section>

    <div id="site-footer"></div>
  </main>

  <script src="../assets/js/site-chrome.js"></script>
  <script type="module" src="./flight-comment-add.js"></script>
</body>
</html>

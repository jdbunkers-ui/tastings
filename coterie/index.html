<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Honey Barrel Hunter – Coterie</title>

    <!-- Skin2 styles -->
    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      /* ---------- Coterie Filter Row ---------- */
      .hbh-filter-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        flex-wrap: wrap;
      }

      /* LEFT: Proof Filter */
      .hbh-proof-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }

      .hbh-proof-label {
        font-size: 12px;
        letter-spacing: 0.2px;
        color: rgba(43, 29, 20, 0.82);
        white-space: nowrap;
      }

      .hbh-proof-wrap input {
        width: 110px;
      }

      /* CENTER: Search */
      .hbh-filter-row #filter {
        flex: 1 1 auto;
        min-width: 220px;
      }

      /* NEW: IG Account Dropdown */
      .hbh-ig-select {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid rgba(181, 122, 42, 0.55);
        background: rgba(246, 241, 234, 0.92);
        color: var(--s2-text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        min-width: 220px;
        cursor: pointer;
      }

      .hbh-ig-select:focus {
        outline: none;
        border-color: rgba(181, 122, 42, 0.85);
      }

      /* RIGHT: Toggle */
      .hbh-toggle-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }

      .hbh-star-toggle {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 999px;
        padding: 6px 10px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        transition:
          transform 120ms ease,
          background 120ms ease,
          border-color 120ms ease;
        perspective: 600px;
      }

      .hbh-star-toggle:active {
        transform: scale(0.98);
      }

      .hbh-star-toggle[aria-pressed="true"] {
        background: rgba(246, 241, 234, 0.92);
        border-color: rgba(181, 122, 42, 0.55);
      }

      .hbh-toggle-label {
        font-size: 12px;
        letter-spacing: 0.2px;
        color: rgba(43, 29, 20, 0.82);
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .hbh-toggle-label {
          display: none;
        }
      }

      @media (max-width: 520px) {
        .skin2-controls {
          padding: 12px;
        }

        .hbh-filter-row {
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 10px;
          align-items: center;
        }

        .hbh-proof-wrap {
          grid-column: 1 / 2;
          width: 100%;
          display: flex;
        }

        .hbh-proof-wrap input {
          width: 100%;
        }

        .hbh-filter-row #filter {
          grid-column: 1 / -1;
          width: 100%;
          min-width: 0;
        }

        .hbh-ig-select {
          grid-column: 1 / -1;
          width: 100%;
        }

        .hbh-toggle-wrap {
          grid-column: 2 / 3;
          justify-self: end;
        }

        .hbh-toggle-label {
          display: none;
        }

        .skin2-status {
          grid-column: 1 / -1;
          width: 100%;
          font-size: 12px;
        }

        .skin2-table-wrap {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }

        .skin2-table {
          min-width: 760px;
        }

        .skin2-table th,
        .skin2-table td {
          white-space: normal;
          vertical-align: top;
        }

        .skin2-table .col-expression,
        .skin2-table .col-distillery,
        .skin2-table .col-picker {
          min-width: 190px;
        }

        .skin2-table .col-msrp,
        .skin2-table .col-proof,
        .skin2-table .col-age,
        .skin2-table .col-score {
          min-width: 90px;
          text-align: center;
        }
      }
    </style>
  </head>

  <body data-page="coterie">
    <main class="skin2-wrap">
      <!-- Skin2 Header Injection Target -->
      <div id="site-header"></div>

      <section class="skin2-card">
        <div class="skin2-controls">
          <div class="hbh-filter-row">

            <!-- LEFT: Proof Filter -->
            <div class="hbh-proof-wrap">
              <label for="proofMax" class="hbh-proof-label">
                Proof ≤
              </label>

              <input
                id="proofMax"
                type="number"
                min="0"
                step="1"
                placeholder="Max proof"
                aria-label="Filter bottles by maximum proof"
              />
            </div>

            <!-- CENTER: Search -->
            <input
              id="filter"
              type="text"
              placeholder="Search bottle expression…"
              aria-label="Search coterie bottle list"
            />

            <!-- NEW: IG Account Dropdown -->
            <select
              id="igAccountSelect"
              class="hbh-ig-select"
              aria-label="Open reviewer tasting page"
            >
              <option value="">
                Open Reviewer Tasting Page…
              </option>
            </select>

            <!-- RIGHT: Toggle -->
            <div class="hbh-toggle-wrap">
              <button
                id="coterieNewOnlyToggle"
                class="hbh-star-toggle"
                type="button"
                aria-pressed="false"
                title="Filter bottles to only those with recently updated coterie"
              >
                <svg
                  class="star-icon"
                  viewBox="0 0 24 24"
                  width="16"
                  height="16"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M12 2.2l2.9 6.2 6.8.6-5.2 4.5 1.6 6.7L12 16.9 5.9 20.2l1.6-6.7L2.3 9l6.8-.6L12 2.2z"
                    fill="rgba(215, 162, 74, 0.95)"
                    stroke="rgba(181, 122, 42, 0.85)"
                    stroke-width="0.9"
                  />
                </svg>
              </button>

              <span class="hbh-toggle-label">
                Filter recently updated Coterie
              </span>
            </div>

            <span class="skin2-status" id="status">
              Loading…
            </span>

          </div>
        </div>

        <!-- Coterie Render Target -->
        <div class="skin2-table-wrap">
          <div id="coterie-content"></div>
        </div>

        <div
          id="error"
          class="skin2-error"
          style="display:none;"
        ></div>

      </section>

      <!-- Skin2 Footer Injection Target -->
      <div id="site-footer"></div>
    </main>

    <!-- Scripts -->
    <script src="../assets/js/site-chrome.js"></script>

    <!-- NEW: IG Account Dropdown Logic -->
    <script type="module">
      import { supabase } from "../assets/js/supabaseClient.js";

      async function loadIgAccounts() {

        const select =
          document.getElementById("igAccountSelect");

        if (!select) return;

        const { data, error } =
          await supabase
            .from("v_MyTastings")
            .select("ig_account_normalized")
            .not("ig_account_normalized", "is", null)
            .order("ig_account_normalized", {
              ascending: true
            });

        if (error) {
          console.error(
            "Failed loading IG accounts",
            error
          );
          return;
        }

        const uniqueAccounts =
          [
            ...new Set(
              (data || [])
                .map(
                  r => r.ig_account_normalized
                )
                .filter(Boolean)
            )
          ];

        for (const acct of uniqueAccounts) {

          const opt =
            document.createElement("option");

          opt.value = acct;
          opt.textContent = `@${acct}`;

          select.appendChild(opt);
        }

        select.addEventListener("change", () => {

          const ig =
            (select.value || "").trim();

          if (!ig) return;

          const url =
            `../MyTastings.html?ig_account=${encodeURIComponent(ig)}`;

          window.open(
            url,
            "_blank",
            "width=1200,height=900,resizable=yes,scrollbars=yes"
          );

          select.selectedIndex = 0;
        });
      }

      loadIgAccounts();
    </script>

    <!-- Toggle wiring -->
    <script>
      (function () {

        const KEY =
          "HBH_COTERIE_ONLY_NEW";

        const btn =
          document.getElementById(
            "coterieNewOnlyToggle"
          );

        // Initialize shared state
        const initial =
          localStorage.getItem(KEY) === "1";

        window.HBH_CoterieFilter = {
          onlyNew: initial
        };

        function setPressed(isOn) {

          if (!btn) return;

          btn.setAttribute(
            "aria-pressed",
            isOn ? "true" : "false"
          );

          btn.title = isOn
            ? "Showing only bottles with recently updated coterie (click to show all)"
            : "Filter bottles to only those with recently updated coterie";
        }

        function dispatch(isOn) {

          window.dispatchEvent(
            new CustomEvent(
              "hbh:coterieFilterChanged",
              {
                detail: {
                  onlyNew: isOn
                }
              }
            )
          );
        }

        // Paint initial UI state
        setPressed(initial);

        // Wire click
        if (btn) {

          btn.addEventListener("click", () => {

            const next =
              !window.HBH_CoterieFilter.onlyNew;

            window.HBH_CoterieFilter.onlyNew =
              next;

            localStorage.setItem(
              KEY,
              next ? "1" : "0"
            );

            setPressed(next);

            dispatch(next);
          });
        }
      })();
    </script>

    <!-- IMPORTANT: Must be module scripts -->
    <script
      type="module"
      src="../assets/js/coterie-page.js"
    ></script>

    <script
      type="module"
      src="../assets/js/inventory-filter.js"
    ></script>
  </body>
</html>

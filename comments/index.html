<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Honey Barrel Hunter — Comments</title>

    <!-- Skin2 shared styles -->
    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      :root {
        --s2-bg: #f6f1ea;
        --s2-border: #d8cfc3;
        --s2-text: #2b1d14;
        --s2-text-muted: #7a6758;
        --s2-amber: #b57a2a;
        --s2-card: rgba(255,255,255,0.86);
      }

      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181, 122, 42, 0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225, 182, 106, 0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 14px 60px;
      }

      .card {
        border: 1px solid var(--s2-border);
        background: var(--s2-card);
        border-radius: 16px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        letter-spacing: 0.3px;
      }

      p {
        font-size: 14px;
        line-height: 1.65;
        color: var(--s2-text);
        margin: 0 0 14px;
      }

      h2 {
        margin: 28px 0 12px;
        font-size: 16px;
        letter-spacing: 0.3px;
      }

      form { display: grid; gap: 12px; margin-top: 10px; }

      label {
        font-size: 13px;
        color: var(--s2-text-muted);
        font-weight: 600;
      }

      input, textarea, button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
      }

      input, textarea {
        border: 1px solid var(--s2-border);
        background: rgba(246, 241, 234, 0.6);
        color: var(--s2-text);
        outline: none;
      }

      input:focus, textarea:focus {
        border-color: rgba(181, 122, 42, 0.55);
        box-shadow: 0 0 0 3px rgba(181, 122, 42, 0.12);
      }

      textarea { min-height: 120px; resize: vertical; }

      button {
        border: 0;
        cursor: pointer;
        background: var(--s2-amber);
        color: #fff;
        font-weight: 700;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .msg { margin-top: 6px; font-size: 13px; }
      .error { color: #8b1e1e; }
      .ok { color: #1a6a3a; }

      .list {
        margin-top: 14px;
        display: grid;
        gap: 12px;
      }

      .comment-card {
        padding: 14px 14px;
        border-radius: 14px;
        background: rgba(246, 241, 234, 0.55);
        border: 1px solid var(--s2-border);
      }

      .meta {
        font-size: 12px;
        color: var(--s2-text-muted);
        margin-bottom: 6px;
        font-weight: 600;
      }
    </style>
  </head>

  <body data-page="comments">
    <div class="wrap">
      <!-- Site Chrome Header Injection -->
      <div id="site-header"></div>

      <section class="card">
        <h1>Leave a comment</h1>
        <p>Have a bottle recommendation, site bug, or feature idea? Drop it here.</p>

        <form id="commentForm">
          <div>
            <label for="name">Name (optional)</label>
            <input id="name" name="name" placeholder="Name" maxlength="60" />
          </div>

          <div>
            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" placeholder="Your comment…" maxlength="1000" required></textarea>
          </div>

          <button id="submitBtn" type="submit">Submit</button>
          <div id="status" class="msg" aria-live="polite"></div>
        </form>

        <h2>Recent comments</h2>
        <div id="comments" class="list" aria-live="polite"></div>
      </section>

      <!-- Site Chrome Footer Injection -->
      <div id="site-footer"></div>
    </div>

    <!-- Site Chrome -->
    <script src="../assets/js/site-chrome.js"></script>

    <!-- Page logic (module) -->
    <script type="module" src="../assets/js/comments-page.js"></script>

    <!-- Tiny helper to map your JS-generated "card" class to Skin2 styling -->
    <script>
      // Your comments-page.js renders each comment with class "card" and "meta".
      // On this page, we want "card" to remain the outer container, so we remap
      // comment items by swapping the class after render (no JS file changes needed).
      const obs = new MutationObserver(() => {
        document.querySelectorAll("#comments .card").forEach(el => {
          el.classList.remove("card");
          el.classList.add("comment-card");
        });
      });
      obs.observe(document.getElementById("comments"), { childList: true, subtree: true });
    </script>
  </body>
</html>

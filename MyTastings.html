<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Whiskey Tastings</title>

  <style>
    :root {
      --bg: #f7f4ef;
      --text: #2b2118;
      --muted: rgba(43, 33, 24, 0.68);
      --line: rgba(43, 33, 24, 0.16);
      --head: rgba(246, 241, 234, 0.9);
      --row-alt: rgba(255, 255, 255, 0.55);
      --accent: #7a4300;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.35;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 10px 60px;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .reviewer {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .reviewer strong {
      font-weight: 900;
    }

    .subline {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-top: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
    }

    thead th {
      background: var(--head);
      color: rgba(43, 33, 24, 0.75);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
      padding: 10px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    tbody td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(43, 33, 24, 0.11);
      vertical-align: top;
    }

    tbody tr:nth-child(even) {
      background: var(--row-alt);
    }

    .num {
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
    }

    .score {
      color: var(--accent);
      font-weight: 900;
    }

    .bottle {
      font-weight: 800;
      color: var(--accent);
      min-width: 260px;
    }

    .notes {
      min-width: 190px;
      max-width: 280px;
      white-space: normal;
    }

    .empty,
    .error {
      padding: 24px 0;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .top {
        display: block;
      }

      .status {
        margin-top: 8px;
      }

      .reviewer {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1 class="reviewer">
          <strong id="reviewerName">Loading…</strong>
        </h1>
        <div class="subline">Personal Whiskey Tastings</div>
      </div>

      <div id="status" class="status">Loading tastings…</div>
    </header>

    <div class="table-wrap">
      <table id="tastingsTable" style="display:none;">
        <thead>
          <tr>
            <th>Score</th>
            <th>Bottle Expression</th>
            <th>Nose Score</th>
            <th>Nose Notes</th>
            <th>Palate Score</th>
            <th>Palate Notes</th>
            <th>Finish Score</th>
            <th>Finish Notes</th>
          </tr>
        </thead>
        <tbody id="tastingsBody"></tbody>
      </table>

      <div id="message" class="empty"></div>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./assets/js/supabaseClient.js";

    const params = new URLSearchParams(window.location.search);

    const igAccount = (params.get("ig_account") || "")
      .trim()
      .replace(/^@/, "")
      .toLowerCase();

    const reviewerNameEl = document.getElementById("reviewerName");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const tableEl = document.getElementById("tastingsTable");
    const bodyEl = document.getElementById("tastingsBody");

    reviewerNameEl.textContent = igAccount ? `@${igAccount}` : "Unknown Reviewer";

    async function loadTastings() {
      if (!igAccount) {
        statusEl.textContent = "";
        messageEl.textContent = "Missing ig_account parameter.";
        return;
      }

      const { data, error } = await supabase
        .from("v_MyTastings")
        .select(`
          composite_score,
          bottle_expression,
          nose_score,
          nose_notes,
          palate_score,
          palate_notes,
          finish_score,
          finish_notes
        `)
        .eq("ig_account_normalized", igAccount)
        .order("composite_score", { ascending: false });

      if (error) {
        console.error(error);
        statusEl.textContent = "";
        messageEl.textContent = "Failed to load tastings.";
        messageEl.className = "error";
        return;
      }

      if (!data || data.length === 0) {
        statusEl.textContent = "";
        messageEl.textContent = "No tastings found.";
        return;
      }

      statusEl.textContent =
        `${data.length} tasting${data.length === 1 ? "" : "s"} • sorted by score`;

      bodyEl.innerHTML = data.map(renderRow).join("");
      messageEl.textContent = "";
      tableEl.style.display = "table";
    }

    function renderRow(row) {
      return `
        <tr>
          <td class="num score">${formatScore(row.composite_score)}</td>
          <td class="bottle">${escapeHtml(row.bottle_expression || "-")}</td>
          <td class="num">${formatScore(row.nose_score)}</td>
          <td class="notes">${escapeHtml(row.nose_notes || "-")}</td>
          <td class="num">${formatScore(row.palate_score)}</td>
          <td class="notes">${escapeHtml(row.palate_notes || "-")}</td>
          <td class="num">${formatScore(row.finish_score)}</td>
          <td class="notes">${escapeHtml(row.finish_notes || "-")}</td>
        </tr>
      `;
    }

    function formatScore(value) {
      if (value === null || value === undefined || value === "") return "-";

      const n = Number(value);

      if (!Number.isFinite(n)) return "-";

      return n.toFixed(1);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadTastings();
  </script>
</body>
</html>

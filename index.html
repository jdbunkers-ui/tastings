<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Honey Barrel Hunter Portal</title>

    <style>
      /* ---------- CSS Variables (Theme) ---------- */
      :root {
        --s2-bg: #f6f1ea;
        --s2-panel: #ffffff;
        --s2-border: #d8cfc3;

        --s2-brown-dark: #3b2a20;
        --s2-brown-mid: #6a4a32;
        --s2-amber: #b57a2a;
        --s2-amber-soft: #e1b66a;

        --s2-text: #2b1d14;
        --s2-text-muted: #7a6758;

        --s2-link: #8a5a20;
        --s2-link-hover: #b57a2a;

        --s2-font-sans: ui-sans-serif, system-ui, -apple-system,
                        Segoe UI, Roboto, Helvetica, Arial;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181, 122, 42, 0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225, 182, 106, 0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 14px 60px;
      }

      .card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.86);
        border-radius: 18px;
        padding: 28px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.4px;
      }

      .sub {
        margin-top: 10px;
        font-size: 14px;
        color: var(--s2-text-muted);
      }

      .under {
        margin-top: 14px;
        font-weight: 800;
        letter-spacing: 0.8px;
        color: var(--s2-brown-mid);
      }

      .actions {
        margin-top: 22px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .pill {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .pill:hover {
        background: rgba(255, 255, 255, 0.70);
      }
      .under-construction {
        margin-top: 6px;
        font-weight: 800;
        letter-spacing: 0.6px;
        color: var(--s2-amber);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <h1>Welcome to the Honey Barrel Hunter Portal</h1>
        <div class="sub under-construction">*** Under Construction ***</div>
        <div class="actions">
          <button
            class="pill"
            type="button"
            onclick="window.location.href='./index_skin2.html'">
            Inventory
          </button>
        </div>
      </div>
    </div>
  </body>
</html>

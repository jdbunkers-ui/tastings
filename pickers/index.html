<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pickers | Honey Barrel Hunter</title>

    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181, 122, 42, 0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225, 182, 106, 0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 14px 46px;
      }

      .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin: 22px 2px 10px;
      }

      .title-with-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
      }

      .muted-card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.55);
        border-radius: 16px;
        padding: 14px;
        color: var(--s2-text-muted);
      }

      .toggle-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .star-toggle {
        appearance: none;
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.70);
        border-radius: 999px;
        padding: 6px 10px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: transform 120ms ease;
      }

      .star-toggle:active { transform: scale(0.98); }

      .star-toggle[aria-pressed="true"] {
        background: rgba(246, 241, 234, 0.92);
        border-color: rgba(181, 122, 42, 0.55);
      }

      .toggle-label {
        font-size: 12px;
        white-space: nowrap;
      }

      @media (max-width: 640px) {
        .title-with-toggle {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        .toggle-label { white-space: normal; }
      }
    </style>
  </head>

  <body data-page="pickers">
    <div class="wrap">
      <div id="site-header"></div>

      <!-- Only the toggle remains -->
      <div class="section-title">
        <div class="title-with-toggle">

          <div class="toggle-wrap">
            <button
              id="pickerNewOnlyToggle"
              class="star-toggle"
              type="button"
              aria-pressed="false"
              title="Filter for only recently updated Tastings"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <path
                  d="M12 2.2l2.9 6.2 6.8.6-5.2 4.5 1.6 6.7L12 16.9 5.9 20.2l1.6-6.7L2.3 9l6.8-.6L12 2.2z"
                  fill="rgba(215, 162, 74, 0.95)"
                />
              </svg>
            </button>

            <span class="toggle-label">
              Filter for only recently updated Tastings
            </span>
          </div>
        </div>
      </div>

      <div id="pickerMount" class="muted-card">Loading barrel pickers…</div>

      <div id="site-footer"></div>
    </div>

    <script src="../assets/js/site-chrome.js"></script>
    <script type="module" src="../assets/js/pickers-page.js"></script>
  </body>
</html>

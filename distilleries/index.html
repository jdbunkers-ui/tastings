<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distillery | Honey Barrel Hunter</title>

    <!-- Skin2 -->
    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      :root {
        --s2-bg: #f6f1ea;
        --s2-panel: #ffffff;
        --s2-border: #d8cfc3;

        --s2-brown-dark: #3b2a20;
        --s2-brown-mid: #6a4a32;
        --s2-amber: #b57a2a;
        --s2-amber-soft: #e1b66a;

        --s2-text: #2b1d14;
        --s2-text-muted: #7a6758;
        --s2-text-invert: #ffffff;

        --s2-link: #8a5a20;
        --s2-link-hover: #b57a2a;

        --s2-font-sans: ui-sans-serif, system-ui, -apple-system,
                        Segoe UI, Roboto, Helvetica, Arial;
        --s2-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco,
                        Consolas, "Liberation Mono", monospace;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181,122,42,0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225,182,106,0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 14px 46px;
      }

      .card {
        border: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.86);
        border-radius: 16px;
        padding: 14px;
      }

      .hero {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 14px;
        margin-top: 10px;
      }
      @media (max-width: 860px) {
        .hero { grid-template-columns: 1fr; }
      }

      .photo {
        border: 1px solid var(--s2-border);
        border-radius: 16px;
        overflow: hidden;
        min-height: 220px;
        display: grid;
        place-items: center;
        color: var(--s2-text-muted);
      }

      .title {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
      }

      .meta {
        margin-top: 10px;
        display: grid;
        gap: 6px;
        font-size: 13px;
      }

      .links {
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }

      /* -------- Filter Row (MATCH inventory/sensory) -------- */
      .hbh-filter-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 18px 0 10px;
      }

      .hbh-filter-row #filter {
        flex: 1 1 auto;
        min-width: 220px;
      }

      .hbh-toggle-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .hbh-toggle-label {
        font-size: 12px;
        color: rgba(43,29,20,0.82);
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .hbh-toggle-label { display: none; }
      }
    </style>
  </head>

  <body data-page="distilleries">
    <div class="wrap">
      <div id="site-header"></div>

      <div id="error" class="skin2-error" style="display:none;"></div>
      <div id="loading" class="muted-card">Loading distillery…</div>

      <div id="content" style="display:none;">
        <div class="hero">
          <div class="photo">
            <img id="distillery-photo" alt="Distillery photo" />
            <div id="photo-missing" style="display:none;">No photo available</div>
          </div>

          <div class="card">
            <h1 id="distillery-name" class="title">—</h1>

            <div class="meta">
              <div><b>Address:</b> <span id="distillery-address">—</span></div>
              <div><b>State:</b> <span id="distillery-state">—</span></div>
            </div>

            <div class="links">
              <a id="maps-link" class="skin2-link" target="_blank">Open in Google Maps</a>
              <a class="skin2-link" href="../inventory/index.html">Back to Inventory</a>
            </div>

            <h2 style="margin-top:18px;">About</h2>
            <div id="distillery-description" class="muted-card">—</div>
          </div>
        </div>

        <!-- 🔍 FILTER ROW -->
        <div class="hbh-filter-row">
          <input
            id="filter"
            type="text"
            placeholder="Search tasted bottles…"
            aria-label="Search distillery inventory"
          />

          <div class="hbh-toggle-wrap">
            <button
              id="distilleryNewOnlyToggle"
              class="hbh-star-toggle"
              type="button"
              aria-pressed="false"
              title="Filter to only recently updated tastings"
            >
              <svg class="hbh-star-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 2.2l2.9 6.2 6.8.6-5.2 4.5 1.6 6.7L12 16.9 5.9 20.2l1.6-6.7L2.3 9l6.8-.6L12 2.2z"
                  fill="rgba(215,162,74,0.95)"
                  stroke="rgba(181,122,42,0.85)"
                  stroke-width="0.9"
                />
              </svg>
            </button>
            <span class="hbh-toggle-label">Only new updates</span>
          </div>

          <span class="skin2-status" id="inventory-status"></span>
        </div>

        <div class="skin2-table-wrap">
          <div id="inventory-content"></div>
        </div>
      </div>

      <div id="site-footer"></div>
    </div>

    <script src="../assets/js/site-chrome.js"></script>
    <script type="module" src="../assets/js/distillery-page.js"></script>
  </body>
</html>

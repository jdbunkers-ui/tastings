<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distillery | Honey Barrel Hunter</title>

    <!-- Skin2 -->
    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      /* Match barrel_pickers/index.html page scaffold */
      :root {
        --s2-bg: #f6f1ea;
        --s2-panel: #ffffff;
        --s2-border: #d8cfc3;

        --s2-brown-dark: #3b2a20;
        --s2-brown-mid: #6a4a32;
        --s2-amber: #b57a2a;
        --s2-amber-soft: #e1b66a;

        --s2-text: #2b1d14;
        --s2-text-muted: #7a6758;
        --s2-text-invert: #ffffff;

        --s2-link: #8a5a20;
        --s2-link-hover: #b57a2a;

        --s2-font-sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        --s2-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181, 122, 42, 0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225, 182, 106, 0.12), transparent 50%),
          var(--s2-bg);
      }

      a { color: var(--s2-link); text-decoration: underline; }
      a:hover { color: var(--s2-link-hover); }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 14px 46px;
      }

      .card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.86);
        border-radius: 16px;
        padding: 14px;
      }

      /* HERO layout same framing as barrel_pickers */
      .hero {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 14px;
        align-items: start;
        margin-top: 10px;
      }
      @media (max-width: 860px) {
        .hero { grid-template-columns: 1fr; }
      }

      .photo {
        border: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.62);
        border-radius: 16px;
        overflow: hidden;
        min-height: 220px;
        display: grid;
        place-items: center;
        color: var(--s2-text-muted);
        font-size: 12px;
      }
      .photo img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

      .title {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.2px;
        font-weight: 900;
      }

      .meta {
        display: grid;
        gap: 6px;
        margin-top: 10px;
        color: rgba(43, 29, 20, 0.86);
        font-size: 13px;
        line-height: 1.35;
      }

      .mono { font-family: var(--s2-font-mono); }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
        font-size: 13px;
      }

      .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin: 18px 2px 10px;
      }
      .section-title h2 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.3px;
        color: rgba(43, 29, 20, 0.90);
        text-transform: uppercase;
      }
      .section-title .hint {
        color: rgba(122, 103, 88, 0.78);
        font-size: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid var(--s2-border);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(255,255,255,0.62);
      }
      thead th {
        text-align: left;
        font-size: 12px;
        color: rgba(43, 29, 20, 0.72);
        padding: 10px 10px;
        border-bottom: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.50);
        white-space: nowrap;
      }
      tbody td {
        padding: 10px 10px;
        border-bottom: 1px solid rgba(216, 207, 195, 0.85);
        font-size: 13px;
        color: rgba(43, 29, 20, 0.92);
        vertical-align: top;
      }
      tbody tr:last-child td { border-bottom: none; }
      .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

      .muted-card {
        border: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.55);
        border-radius: 16px;
        padding: 14px;
        color: var(--s2-text-muted);
      }

      .error {
        border: 1px solid rgba(231, 76, 60, 0.35);
        background: rgba(231, 76, 60, 0.10);
        color: rgba(43, 29, 20, 0.92);
      }
    </style>
  </head>

  <body data-page="distilleries">
    <div class="wrap">
      <!-- Skin2 Header Injection Target -->
      <div id="site-header"></div>

      <!-- Error -->
      <div id="error" class="muted-card error" style="display:none;"></div>

      <!-- Loading -->
      <div id="loading" class="muted-card">Loading distillery…</div>

      <!-- Content (JS will show/hide) -->
      <div id="content" style="display:none;">
        <div class="hero">
          <!-- Photo card -->
          <div class="photo" id="distillery-photo-wrap">
            <img id="distillery-photo" alt="Distillery photo" style="display:none;" />
            <div id="photo-missing" style="display:none;">No photo available yet.</div>
          </div>

          <!-- Details card -->
          <div class="card" id="distillery-card">
            <h1 id="distillery-name" class="title">—</h1>

            <div class="meta">
              <div>
                <b>Address:</b>
                <span id="distillery-address">—</span>
              </div>

              <div>
                <b>State:</b>
                <span id="distillery-state" class="mono">—</span>
              </div>
            </div>

            <div class="links">
              <a id="maps-link" class="skin2-link" target="_blank" rel="noopener">Open in Google Maps</a>
              <a id="back-link" class="skin2-link" href="../inventory/index.html">Back to Inventory</a>
            </div>

            <div class="section-title" style="margin:18px 0 8px;">
              <h2 style="text-transform:uppercase;">About</h2>
            </div>
            <div id="distillery-description" class="muted-card" style="white-space:pre-wrap;">—</div>
          </div>
        </div>

        <!-- Bottles section -->
        <div class="section-title" style="margin-top:22px;">
          <h2>
            Tasted Bottles
          </h2>
          <div class="hint" id="bottles-count"></div>
        </div>

        <div id="bottles-empty" class="muted-card" style="display:none;">
          No tasted bottles found for this distillery yet.
        </div>

        <div id="bottles-table-wrap" style="display:none;">
          <table>
            <thead>
              <tr>
                <th>Bottle Expression</th>
                <th>Spirit Subtype</th>
                <th class="num">Score</th>
                <th class="num">Proof</th>
                <th class="num">Age</th>
                <th class="num">MSRP</th>
              </tr>
            </thead>
            <tbody id="bottles-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Skin2 Footer Injection Target -->
      <div id="site-footer"></div>
    </div>

    <!-- Skin2 header/footer injector -->
    <script src="../assets/js/site-chrome.js"></script>

    <!-- Distillery page controller -->
    <script type="module" src="../assets/js/distillery-page.js"></script>
  </body>
</html>

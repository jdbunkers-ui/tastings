<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barrel Picker | Honey Barrel Hunter</title>

    <!-- Skin2 -->
    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181,122,42,0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225,182,106,0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 14px 46px;
      }

      .card {
        border: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.86);
        border-radius: 16px;
        padding: 14px;
      }

      .hero {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 14px;
        margin-top: 10px;
      }

      @media (max-width: 860px) {
        .hero { grid-template-columns: 1fr; }
      }

      .photo {
        border: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.62);
        border-radius: 16px;
        min-height: 220px;
        display: grid;
        place-items: center;
        color: var(--s2-text-muted);
        overflow: hidden;
      }

      .photo img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

      /* ---------- Filter row ---------- */
      .hbh-filter-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        flex-wrap: wrap;
      }

      .hbh-filter-row #filter {
        flex: 1 1 auto;
        min-width: 220px;
      }

      .hbh-toggle-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .hbh-star-toggle {
        appearance: none;
        border: 1px solid var(--s2-border);
        background: rgba(255,255,255,0.7);
        border-radius: 999px;
        padding: 6px 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .hbh-star-toggle[aria-pressed="true"] {
        background: rgba(246,241,234,0.92);
        border-color: rgba(181,122,42,0.55);
      }

      .hbh-toggle-label {
        font-size: 12px;
        color: rgba(43,29,20,0.82);
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .hbh-toggle-label { display: none; }
      }
    </style>
  </head>

  <body data-page="barrel_pickers">
    <div class="wrap">
      <div id="site-header"></div>

      <div id="error" class="muted-card error" style="display:none;"></div>

      <!-- HERO -->
      <div class="hero">
        <div class="photo" id="bp-photo"></div>

        <div class="card">
          <h1 id="bp-title">—</h1>
          <p id="bp-subtitle" class="skin2-status"></p>
          <div id="bp-card"></div>
        </div>
      </div>

      <!-- FILTERS -->
      <section class="skin2-card" style="margin-top:22px;">
        <div class="skin2-controls">
          <div class="hbh-filter-row">
            <input
              id="filter"
              type="text"
              placeholder="Search barrel picks…"
              aria-label="Search barrel picker inventory"
            />

            <div class="hbh-toggle-wrap">
              <button
                id="barrelPickerNewOnlyToggle"
                class="hbh-star-toggle"
                type="button"
                aria-pressed="false"
                title="Filter for only recently updated Tastings"
              >
                <!-- ⭐ REAL STAR (spins via skin2.css) -->
                <svg
                  class="hbh-star-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  style="width:16px;height:16px;"
                >
                  <path
                    d="M12 2.2l2.9 6.2 6.8.6-5.2 4.5 1.6 6.7L12 16.9 5.9 20.2l1.6-6.7L2.3 9l6.8-.6L12 2.2z"
                    fill="rgba(215,162,74,0.95)"
                    stroke="rgba(181,122,42,0.85)"
                    stroke-width="0.9"
                  />
                </svg>
              </button>

              <span class="hbh-toggle-label">
                Filter for only recently updated Tastings
              </span>
            </div>

            <span class="skin2-status" id="bp-table-hint"></span>
          </div>
        </div>

        <div class="skin2-table-wrap">
          <div id="bp-table"></div>
        </div>
      </section>

      <div id="site-footer"></div>
    </div>

    <script src="../assets/js/site-chrome.js"></script>
    <script type="module" src="../assets/js/barrel-picker-page.js"></script>
  </body>
</html>

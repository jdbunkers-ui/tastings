<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Honey Barrel Hunter — Comments</title>

  <!-- Adjust this path if your CSS lives elsewhere -->
  <link rel="stylesheet" href="../assets/css/site.css" />

  <style>
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
    form { display: grid; gap: 12px; }
    input, textarea, button { font: inherit; padding: 10px 12px; border-radius: 10px; }
    input, textarea {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(0,0,0,.25);
      color: #fff;
    }
    textarea { min-height: 120px; resize: vertical; }
    button { border: 0; cursor: pointer; }
    .msg { margin-top: 10px; opacity: .9; }
    .list { margin-top: 26px; display: grid; gap: 14px; }
    .card {
      padding: 14px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.12);
    }
    .meta { font-size: 12px; opacity: .75; margin-bottom: 6px; }
    .error { color: #ffb3b3; }
    .ok { color: #b7ffcc; }
  </style>
</head>

<body data-page="comments">
  <!-- If your chrome injector expects these, keep them -->
  <div id="site-header"></div>

  <main class="wrap">
    <h1>Leave a comment</h1>
    <p>Have a bottle recommendation, site bug, or feature idea? Drop it here.</p>

    <form id="commentForm">
      <input id="name" name="name" placeholder="Name (optional)" maxlength="60" />
      <textarea id="comment" name="comment" placeholder="Your comment…" maxlength="1000" required></textarea>
      <button id="submitBtn" type="submit">Submit</button>
      <div id="status" class="msg" aria-live="polite"></div>
    </form>

    <h2 style="margin-top:28px;">Recent comments</h2>
    <div id="comments" class="list" aria-live="polite"></div>
  </main>

  <div id="site-footer"></div>

  <!-- Shared header/footer injection -->
  <!-- Adjust this path if your file lives elsewhere -->
  <script src="../assets/js/site-chrome.js"></script>

  <!-- Page logic (module) -->
  <script type="module" src="./comments-page.js"></script>
</body>
</html>

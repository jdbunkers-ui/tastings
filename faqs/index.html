<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FAQ | Honey Barrel Hunter</title>

    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--s2-font-sans);
        color: var(--s2-text);
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(181, 122, 42, 0.14), transparent 55%),
          radial-gradient(900px 700px at 90% 0%, rgba(225, 182, 106, 0.12), transparent 50%),
          var(--s2-bg);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 14px 46px;
      }

      .intro-card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.86);
        border-radius: 16px;
        padding: 18px;
        margin: 14px 0 18px;
        color: var(--s2-text);
      }

      .intro-title {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: 0.3px;
        color: rgba(43, 29, 20, 0.94);
      }

      .intro-subtitle {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(43, 29, 20, 0.88);
        max-width: 92ch;
      }

      .muted-card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.55);
        border-radius: 16px;
        padding: 14px;
        color: var(--s2-text-muted);
      }

      .faq-card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.80);
        border-radius: 16px;
        padding: 14px;
        margin: 10px 0;
      }

      .faq-q {
        margin: 0;
        font-size: 14px;
        font-weight: 900;
        color: rgba(43, 29, 20, 0.94);
      }

      .faq-a {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.65;
        color: rgba(43, 29, 20, 0.86);
        white-space: pre-wrap;
      }

      .faq-meta {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.75;
      }
    </style>
  </head>

  <body data-page="faqs">
    <div class="wrap">
      <div id="site-header"></div>

      <section class="intro-card">
        <h1 class="intro-title">FAQ</h1>
        <p class="intro-subtitle">
          Answers to common questions about Honey Barrel Hunter — methodology, scoring, and how to read the data.
        </p>
      </section>

      <div id="faqMount" class="muted-card">Loading FAQs…</div>

      <div id="site-footer"></div>
    </div>

    <script src="../assets/js/site-chrome.js"></script>

    <!-- Inline loader: safe until v_faqs exists -->
    <script type="module">
      import { supabase } from "../assets/js/supabaseClient.js";

      const VIEW_FAQS = "v_faqs";
      const elMount = document.getElementById("faqMount");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderComingSoon(message) {
        if (!elMount) return;
        elMount.innerHTML = `
          <div class="muted-card">
            <div style="font-weight:900; color: rgba(43,29,20,0.92); margin-bottom:6px;">
              Coming soon
            </div>
            <div style="line-height:1.65;">
              ${escapeHtml(message)}
            </div>
          </div>
        `;
      }

      function renderFaqs(rows) {
        if (!rows || !rows.length) {
          renderComingSoon("No FAQs have been published yet.");
          return;
        }

        const html = rows.map((r) => {
          const q = r.question ?? r.faq_question ?? r.q ?? "";
          const a = r.answer ?? r.faq_answer ?? r.a ?? "";
          const updated =
            r.updated_at ?? r.updated_timestamp ?? r.modified_at ?? r.create_date ?? null;

          return `
            <article class="faq-card">
              <h2 class="faq-q">${escapeHtml(q)}</h2>
              <p class="faq-a">${escapeHtml(a)}</p>
              ${updated ? `<div class="faq-meta">Updated: ${escapeHtml(String(updated))}</div>` : ""}
            </article>
          `;
        }).join("");

        elMount.innerHTML = html;
      }

      async function loadFaqs() {
        if (!elMount) return;

        elMount.innerHTML = `<div class="muted-card">Loading FAQs…</div>`;

        const { data, error } = await supabase
          .from(VIEW_FAQS)
          .select("*");

        if (error) {
          // Most common right now: view doesn't exist (42P01) or permissions
          renderComingSoon(
            "The FAQ database view (v_faqs) isn’t available yet. Once it’s created and enabled, FAQs will show here automatically."
          );
          return;
        }

        renderFaqs(data || []);
      }

      loadFaqs();
    </script>
  </body>
</html>

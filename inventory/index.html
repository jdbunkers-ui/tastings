<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velvet Room – Inventory</title>

    <!-- Base site styles (optional) -->
    <!-- <link rel="stylesheet" href="..assets/css/site.css" />-->

    <!-- Skin2 styles -->
    <link rel="stylesheet" href="..assets/css/skin2.css" />
  </head>

  <body>
    <!-- Skin2 Header Injection Target -->
    <div id="site-header"></div>

    <main class="skin2-wrap">
    <section class="skin2-card">

    <!-- Flight Fight Ticker (Inventory only) -->
    <div id="flightTickerMount" class="flight-ticker-mount" style="display:none;"></div>

    <!-- Header band (optional; layout_skin2.js also injects header at top) -->
    <div class="skin2-controls">
      <button
        type="button"
        class="skin2-btn"
        onclick="window.location.href='../index.html'"
        Home
      </button>
    
      <input
        id="filter"
        type="text"
        placeholder="Search inventory…"
        aria-label="Search bottle inventory"
      />
    
      <span class="skin2-status" id="status">Loading…</span>
    </div>


        <!-- Inventory Render Target -->
        <div class="skin2-table-wrap">
          <div id="inventory-content"></div>
        </div>

        <!-- Error -->
        <div id="error" class="skin2-error" style="display:none;"></div>
      </section>
    </main>

    <!-- Skin2 Footer Injection Target -->
    <div id="site-footer"></div>

    <!-- Skin2 layout injector -->
    <!-- <script src="..assets/js/layout_skin2.js"></script>-->
    <script type="module" src="../assets/js/layout_skin2.js"></script>

    <!-- Inventory page logic -->
    <script type="module" src="..assets/js/inventorySkin2Page.js?v=skin2_002"></script>

    <!-- Inventory text filter -->
    <script type="module" src="..assets/js/inventorySkin2Filter.js?v=skin2_002"></script>

  </body>
</html>

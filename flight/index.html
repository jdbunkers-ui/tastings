<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Honey Barrel Hunter – Flight</title>

    <link rel="stylesheet" href="../assets/css/skin2.css" />

    <style>
      .flight-hero {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .flight-analyst-wrap {
        margin-top: 4px;
      }

      .flight-title-wrap h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .flight-subtitle {
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.2px;
        color: rgba(43, 29, 20, 0.78);
      }

      .flight-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(181, 122, 42, 0.45);
        background: rgba(246, 241, 234, 0.92);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.3px;
        color: var(--s2-text);
        white-space: nowrap;
      }

      .flight-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-top: 10px;
      }

      @media (max-width: 1100px) {
        .flight-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 700px) {
        .flight-grid {
          grid-template-columns: 1fr;
        }
      }

      .flight-card {
        border: 1px solid var(--s2-border);
        background: rgba(255, 255, 255, 0.68);
        border-radius: 16px;
        overflow: hidden;
      }

      .flight-card-media {
        aspect-ratio: 4 / 3;
        background: linear-gradient(
          180deg,
          rgba(64, 39, 21, 0.1),
          rgba(64, 39, 21, 0.04)
        );
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .flight-card-media img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }

      .flight-card-body {
        padding: 14px;
      }

      .flight-position {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: rgba(43, 29, 20, 0.62);
        margin-bottom: 6px;
        text-align: center;
      }

      .flight-bottle-name {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.25;
        text-align: center;
      }

      .flight-bottle-desc {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.35;
        font-weight: 600;
        color: rgba(43, 29, 20, 0.78);
        min-height: 42px;
        text-align: center;
      }

      .flight-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 10px;
        margin-bottom: 12px;
      }

      .flight-meta-item {
        border: 1px solid rgba(181, 122, 42, 0.18);
        border-radius: 12px;
        padding: 8px 10px;
        background: rgba(246, 241, 234, 0.62);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        min-height: 86px;
      }

      .flight-meta-label {
        display: block;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: rgba(43, 29, 20, 0.58);
        margin-bottom: 4px;
        text-align: center;
      }

      .flight-meta-value {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: var(--s2-text);
        text-align: center;
        line-height: 1.25;
      }

      .flight-vote-btn,
      .flight-voted-badge {
        width: 100%;
        border-radius: 999px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.3px;
        text-align: center;
      }

      .flight-vote-btn {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid rgba(181, 122, 42, 0.55);
        background: rgba(246, 241, 234, 0.92);
        color: var(--s2-text);
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease,
          border-color 120ms ease;
      }

      .flight-vote-btn:hover {
        background: rgba(255, 255, 255, 0.96);
        border-color: rgba(181, 122, 42, 0.78);
      }

      .flight-vote-btn:active {
        transform: scale(0.985);
      }

      .flight-vote-btn[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .flight-voted-badge {
        border: 1px solid rgba(181, 122, 42, 0.55);
        background: rgba(215, 162, 74, 0.14);
        color: var(--s2-text);
      }

      .flight-section-title {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .flight-results-wrap {
        margin-top: 18px;
      }

      .flight-bars {
        display: grid;
        gap: 12px;
      }

      .flight-bar-row {
        display: grid;
        grid-template-columns: 210px 1fr 86px;
        gap: 12px;
        align-items: center;
      }

      @media (max-width: 760px) {
        .flight-bar-row {
          grid-template-columns: 1fr;
        }
      }

      .flight-bar-label {
        font-size: 13px;
        font-weight: 700;
      }

      .flight-bar-track {
        height: 14px;
        border-radius: 999px;
        background: rgba(43, 29, 20, 0.1);
        overflow: hidden;
      }

      .flight-bar-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgba(181, 122, 42, 0.82),
          rgba(215, 162, 74, 0.95)
        );
      }

      .flight-bar-value {
        font-size: 12px;
        font-weight: 800;
        text-align: right;
        white-space: nowrap;
      }

      .flight-comments {
        display: grid;
        gap: 10px;
      }

      .flight-comment {
        border: 1px solid rgba(181, 122, 42, 0.18);
        background: rgba(255, 255, 255, 0.55);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .flight-comment-text {
        font-size: 14px;
        line-height: 1.45;
      }

      .flight-comment-meta {
        margin-top: 6px;
        font-size: 11px;
        color: rgba(43, 29, 20, 0.6);
      }

      .flight-chart-wrap {
        border: 1px solid rgba(181, 122, 42, 0.18);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.52);
        padding: 12px;
      }

      #flightTrendChart,
      #flightValueChart {
        width: 100%;
        height: 320px;
        display: block;
      }

      .flight-empty {
        padding: 14px;
        color: rgba(43, 29, 20, 0.78);
      }

      .flight-hidden {
        display: none !important;
      }

      .col-picker {
        white-space: nowrap;
      }

      .flight-analytics-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .flight-analytics-panel {
        border: 1px solid rgba(181, 122, 42, 0.18);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.45);
        padding: 14px;
      }

      .flight-insight-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 760px) {
        .flight-insight-grid {
          grid-template-columns: 1fr;
        }
      }

      .flight-insight-card {
        border: 1px solid rgba(181, 122, 42, 0.18);
        border-radius: 14px;
        background: rgba(246, 241, 234, 0.55);
        padding: 12px 14px;
      }

      .flight-insight-wide {
        grid-column: 1 / -1;
      }

      .flight-insight-label {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(43, 29, 20, 0.58);
        margin-bottom: 6px;
      }

      .flight-insight-title {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.3;
        color: var(--s2-text);
        margin-bottom: 4px;
      }

      .flight-insight-metric {
        font-size: 13px;
        color: rgba(43, 29, 20, 0.8);
        line-height: 1.35;
      }

      @media (max-width: 520px) {
        .skin2-controls {
          padding: 12px;
        }

        .flight-hero {
          display: grid;
          grid-template-columns: 1fr;
          gap: 10px;
          align-items: start;
        }

        .flight-title-wrap h1 {
          font-size: 24px;
        }

        .flight-status-pill {
          width: 100%;
          justify-content: center;
          white-space: normal;
          text-align: center;
        }

        .flight-grid {
          gap: 12px;
        }

        .flight-card-body {
          padding: 12px;
        }

        .flight-meta {
          gap: 8px;
        }

        #flightTrendChart,
        #flightValueChart {
          height: 260px;
        }
      }
    </style>
  </head>

  <body data-page="flight">
    <main class="skin2-wrap">
      <div id="site-header"></div>

      <section class="skin2-card">
        <div class="flight-hero">
          <div class="flight-title-wrap">
            <h1>Flight</h1>
            <div class="flight-subtitle" id="flightSubtitle">
              Blind bourbon tasting
            </div>
          </div>

          <div class="flight-status-pill" id="flightStatusPill">
            Loading…
          </div>
        </div>

        <div class="skin2-controls">
          <span class="skin2-status" id="status">Loading…</span>
        </div>

        <div id="flightContent">
          <div class="flight-empty">Loading current flight…</div>
        </div>

        <div id="error" class="skin2-error" style="display:none;"></div>
      </section>

      <div id="site-footer"></div>
    </main>

    <script src="../assets/js/site-chrome.js"></script>
    <script type="module" src="./flight-page.js"></script>
  </body>
</html>
